name: CI

# Questo file fa una cosa che vale piu di quanto sembri: costruisce l'APK sulle
# macchine di GitHub, gratis, senza che sul portatile ci sia installato niente
# di Android. Chi vuole provare l'app scarica il file dalla pagina della run.
#
# Nota sul wrapper: qui si invoca `gradle` e non `./gradlew`, perche il binario
# del wrapper non e versionato (e un jar, e non si mettono jar nel repo). Con
# `./gradlew` questa CI fallirebbe alla prima riga con "No such file". In
# locale invece il wrapper esiste, perche lo genera Android Studio.

on:
  push:
    branches: [main]
  pull_request:

env:
  VERSIONE_GRADLE: "8.12"

jobs:
  motore:
    name: Motore di sorteggio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlli statici Android
        run: python3 tools/controlla_android.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.VERSIONE_GRADLE }}

      # Il modulo teamdraw e Kotlin puro: si testa senza SDK Android,
      # quindi la CI resta veloce e non scarica mezzo gigabyte.
      - name: Test
        run: gradle :core:teamdraw:test --no-daemon

      - name: Referto dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/teamdraw/build/reports/tests/

  apk:
    name: APK di debug
    runs-on: ubuntu-latest
    needs: motore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.VERSIONE_GRADLE }}

      # Due variabili di repository, non due segreti: la chiave anon e pubblica
      # per definizione — vive gia nel browser di chiunque apra la web app — e a
      # proteggere i dati sono le policy di Row Level Security. Si impostano in
      # Settings -> Secrets and variables -> Actions -> Variables.
      # Senza, l'APK si costruisce lo stesso ma non parla con nessun database.
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug --no-daemon

      # L'APK resta scaricabile dalla pagina della run per 90 giorni:
      # comodo per far provare una versione senza compilare nulla.
      - uses: actions/upload-artifact@v4
        with:
          name: convocami-debug
          path: app/build/outputs/apk/debug/*.apk
