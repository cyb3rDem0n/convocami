name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  motore:
    name: Motore di sorteggio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Il modulo teamdraw e Kotlin puro: si testa senza SDK Android,
      # quindi la CI resta veloce e non scarica mezzo gigabyte.
      - name: Test
        run: ./gradlew :core:teamdraw:test --no-daemon

      - name: Referto dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/teamdraw/build/reports/tests/

  apk:
    name: APK di debug
    runs-on: ubuntu-latest
    needs: motore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      # L'APK resta scaricabile dalla pagina della run per 90 giorni:
      # comodo per far provare una versione senza compilare nulla.
      - uses: actions/upload-artifact@v4
        with:
          name: callmeup-debug
          path: app/build/outputs/apk/debug/*.apk
