# Impostazioni del build, valide per tutti i moduli.
#
# Questo file mancava, e la sua assenza non si vede leggendo il progetto: si
# vede al primo build vero, quando AGP si ferma con «This project uses AndroidX
# dependencies, but the 'android.useAndroidX' property is not enabled».

# Senza questa riga il modulo app non compila, punto. Le librerie che usiamo
# sono tutte AndroidX e AGP pretende che lo si dichiari.
android.useAndroidX=true

# Ogni modulo genera solo le proprie risorse in R, invece di ereditare quelle
# delle dipendenze. Build piu veloci e APK piu piccolo; e il default dei
# progetti nuovi, ma va scritto perche AGP non lo assume.
android.nonTransitiveRClass=true

# 2 GB bastano per questo progetto e stanno larghi dentro i 7 GB di RAM di un
# runner GitHub. Il default di Gradle e 512 MB, che con AGP e Compose finisce
# in OutOfMemory a meta compilazione.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Compila in parallelo i moduli indipendenti e riusa i risultati gia calcolati.
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
